<script>
    const restapi = "https://developmenterasmus.kolojar.cz";
    //const restapi = "http://127.0.0.1:5501";

    function getAllVehicles(code = null) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/vehicles?code=" + code, true); // ?code can be removed
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo1").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getAllInspections(vehicleId = null) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/inspections?id_vehicles=" + vehicleId, true); // ?id_vehicles can be removed
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo11").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function insertVehicleChecklist(vehicleId, checklistId) {
        let data = {};
        data.id_checklists = checklistId;

    }

    function removeVehicleChecklist(vehicleId, checklistId) {

    function createFile(fileElement) {
        const formData = new FormData();
        formData.append("file", fileElement.files[0]);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", restapi + "/api/files", true);
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo5").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(formData);
    }

    function createChecklistItem(name, description) {
        let data = {};

    function createVehicle(
        name,
        type,
        license_plate,
        code,
        last_maintenance,
        last_maintenance_km,
        next_maintenance,
        maintenance_interval_km,
        id_files,
        state,
    ) {
        let data = {};
        data.name = name;
        data.type = type;
        data.license_plate = license_plate;
        data.code = code;
        data.last_maintenance = last_maintenance;
        data.id_files = id_files;
        data.state = state;
        data.last_maintenance_km = last_maintenance_km;
        data.next_maintenance = next_maintenance;
        data.maintenance_interval_km = maintenance_interval_km;
        const xhr = new XMLHttpRequest();
        xhr.open("POST", restapi + "/api/vehicles", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // code work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo17").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }

    function createProblem(inspectionId, checklistId, note, fileId, priority = "medium") {
        let data = {};
        data.id_inspections = inspectionId;
        data.id_checklists = checklistId;
        data.note = note;
        data.id_files = fileId;
        data.priority = priority;
        const xhr = new XMLHttpRequest();
        xhr.open("POST", restapi + "/api/problems", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // code work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo22").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }

    function createInspection(id_vehicles, passed, note, id_users, km, fuel, type, oil_picture, link = null) {
        let data = {};
        data.id_vehicles = id_vehicles;
        data.passed = passed;
        data.note = note;
        data.id_users = id_users;
        data.km = km;
        data.fuel = fuel;
        data.type = type;
        data.oil_picture = oil_picture;
        data.link = link;
        const xhr = new XMLHttpRequest();
        xhr.open("POST", restapi + "/api/inspections", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // code work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo18").innerHTML = xhr.status + "<br>" + xhr.responseText;

    function rewriteChecklistItem(checklistId, name, description) {
        let data = {};
        data.id_checklists = checklistId;
        data.name = name;
        data.description = description;
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", "../databaseAPI/checklists.php", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)

    }

    function rewriteChecklistItemCell(checklistId, column, name, description) {
        let data = {};
        data.column = column;
        data.id_checklists = checklistId;
        data.name = name;
        data.description = description;
        const xhr = new XMLHttpRequest();
        xhr.open("PATCH", "../databaseAPI/checklists.php", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {

            document.getElementById("demo8").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }
</script>
