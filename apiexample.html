<script>
    let restapi = "http://10.1.17.4:5501";
    //let data = {vehicle: 2};
    function getAllVehicles(code = null) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/vehicles?code=" + code, true); // ?code can be removed
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo1").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getAllInspections(vehicleId = null) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/inspections?id_vehicles=" + vehicleId, true); // ?id_vehicles can be removed
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo11").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getAllChecklistItems(vehicleId = null) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/checklists?id_vehicles=" + vehicleId, true); // ?id_vehicles can be removed
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo3").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getAllProblems(vehicleId = null) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/problems?id_vehicles=" + vehicleId, true); // ?id_vehicles can be removed
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo13").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getInspectionDetails(inspectionId) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/inspections/" + inspectionId, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo12").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getProblemDetails(problemId) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/problems/" + problemId, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo14").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getVehicleDetails(vehicleId) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/vehicles/" + vehicleId, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo2").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function getChecklistItemDetails(checklistId) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", restapi + "/api/checklists/" + checklistId, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo4").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send();
    }

    function createFile(fileElement) {
        const formData = new FormData();
        formData.append("file", fileElement.files[0]);
        //console.log(fileElement.files[0]);

        //console.log(formData);
        const xhr = new XMLHttpRequest();
        xhr.open("POST", restapi + "/api/files", true);
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo5").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(formData);
    }

    function createChecklistItem(name, description) {
        let data = {};
        data.name = name;
        data.description = description;
        const xhr = new XMLHttpRequest();
        xhr.open("POST", restapi + "/api/checklists", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // code work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo6").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }

    function deleteChecklistItem(checklistId) {
        let data = {};
        data.id_checklists = checklistId;
        const xhr = new XMLHttpRequest();
        xhr.open("DELETE", "../databaseAPI/checklists.php", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo9").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }

    function createUser(username, email, password) {
        let data = {};
        data.username = username;
        data.email = email;
        data.password = password;
        const xhr = new XMLHttpRequest();
        xhr.open("POST", restapi + "/api/users", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // code work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo10").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }

    function rewriteChecklistItem(checklistId, name, description) {
        let data = {};
        data.id_checklists = checklistId;
        data.name = name;
        data.description = description;
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", "../databaseAPI/checklists.php", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo7").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }

    function rewriteChecklistItemCell(checklistId, column, name, description) {
        let data = {};
        data.column = column;
        data.id_checklists = checklistId;
        data.name = name;
        data.description = description;
        const xhr = new XMLHttpRequest();
        xhr.open("PATCH", "../databaseAPI/checklists.php", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = () => {
            // work with response here (code: xhr.status, json response: xhr.responseText)
            document.getElementById("demo8").innerHTML = xhr.status + "<br>" + xhr.responseText;
        };
        xhr.send(JSON.stringify(data));
    }
</script>
