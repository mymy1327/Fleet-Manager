<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #cameraContainer {
            position: relative;
            width: min(100%, 640px);
        }

        #camera {
            display: block;
            width: 100%;
            height: auto;
            background: #111;
        }

        #takePicture {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p id="cameraStatus">Press "Take picture" to start the camera, then press it again to capture.</p>
    <ul id="cameraList"></ul>
    <div id="cameraContainer">
        <video id="camera" autoplay playsinline></video>
        <button id="takePicture">Take picture</button>
    </div>
    <canvas id="canvas" hidden></canvas>
    <script type="module" src="image-Check.js"></script>
</body>
</html>
