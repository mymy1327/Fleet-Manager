<div id="demo"></div>
<button onclick="nah()">try</button>
<script>
let data = {vehicle: 2};
function nah() {
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "../databaseAPI/getVehicleChecklist.php", true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onload = () => document.getElementById("demo").innerHTML = (xhr.responseText);
  xhr.send(JSON.stringify(data));
}
</script>
