<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Card Example</title>
    <link rel="stylesheet" href="../CSS/style_en.css">
</head>
<body>
    <main class="page">
        <div class="page-heading">
            <div>
                <h1>Fleet card example</h1>
                <p class="subtitle">A fleet summary card using the English stylesheet</p>
            </div>
        </div>

        <div class="cards">
            <article class="card">
                <span class="card-icon" aria-hidden="true">&#x26DF;</span>
                <strong class="card-value">24</strong>
                <span class="card-label">Vehicles in fleet</span>
            </article>
        </div>
    </main>
</body>
</html>
