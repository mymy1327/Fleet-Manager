name: Sync Branch Folders on Windows

on:
  push:
    branches:
      - main
      - staging
      - dev

jobs:
  sync-folder:
    runs-on: self-hosted
    defaults:
      run:
        # Fixes ExecutionPolicy (PSSecurityException)
        shell: powershell -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Sync Code to Branch Folder
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $Branch = "${{ github.ref_name }}"
          $DeployDir = "C:\apps\$Branch"
          $RepoUrl = "git@github.com:${{ github.repository }}.git"

          # 1. Create a temporary SSH key file path
          $TempSshKey = Join-Path $env:TEMP "deploy_key_$([Guid]::NewGuid().ToString('N'))"

          try {
              # 2. Write private key with Unix line endings (LF)
              [System.IO.File]::WriteAllText($TempSshKey, ($env:SSH_KEY -replace "`r`n", "`n") + "`n")

              # 3. Fix SSH permissions using icacls (restricts access to current user only)
              icacls.exe $TempSshKey /inheritance:r /grant:r "$($env:USERNAME):F" | Out-Null

              # 4. Configure GIT_SSH_COMMAND with forward slashes for OpenSSH compatibility
              $KeyPathFormatted = $TempSshKey -replace '\\', '/'
              $env:GIT_SSH_COMMAND = "ssh -i `"$KeyPathFormatted`" -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL"

              # 5. Create directory if missing
              if (-not (Test-Path $DeployDir)) {
                  New-Item -ItemType Directory -Path $DeployDir -Force
              }

              # 6. Clone if first time, otherwise fetch and reset
              if (-not (Test-Path "$DeployDir\.git")) {
                  git clone -b $Branch $RepoUrl $DeployDir
              } else {
                  Set-Location $DeployDir
                  git fetch origin $Branch
                  git reset --hard "origin/$Branch"
              }
          }
          finally {
              # 7. Clean up the SSH key from disk
              if (Test-Path $TempSshKey) {
                  Remove-Item -Path $TempSshKey -Force
              }
          }
