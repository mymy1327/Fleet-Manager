name: Sync Branch Folders on Windows

on:
  push:
    branches:
      - main

jobs:
  sync-folder:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Sync Code to Branch Folder
        run: |
          $Branch = "${{ github.ref_name }}"
          $DeployDir = "C:\apps\$Branch"
          $RepoUrl = "https://github.com/${{ github.repository }}.git"

          # Create directory if missing
          if (-not (Test-Path $DeployDir)) {
              New-Item -ItemType Directory -Path $DeployDir -Force
          }

          # Clone if first time, otherwise fetch and reset
          if (-not (Test-Path "$DeployDir\.git")) {
              git clone -b $Branch $RepoUrl $DeployDir
          } else {
              Set-Location $DeployDir
              git fetch origin $Branch
              git reset --hard "origin/$Branch"
          }
