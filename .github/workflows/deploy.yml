name: Sync Branch Folders on Windows via Ephemeral SSH Key

on:
  push:
    branches:
      - main

jobs:
  sync-folder:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Sync Code to Branch Folder
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $Branch = "${{ github.ref_name }}"
          $DeployDir = "C:\apps\$Branch"
          $RepoUrl = "git@github.com:${{ github.repository }}.git"

          # 1. Create temp file path
          $TempSshKey = Join-Path $env:TEMP "deploy_key_$([Guid]::NewGuid().ToString('N'))"
          
          try {
              # 2. Write key with LF line endings
              [System.IO.File]::WriteAllText($TempSshKey, ($env:SSH_KEY -replace "`r`n", "`n") + "`n")

              # 3. Restrict Windows ACL permissions so SSH doesn't ignore the key
              $Acl = Get-Acl $TempSshKey
              $Acl.SetAccessRuleProtection($true, $false)
              $User = [System.Security.Principal.NTAccount]$env:USERNAME
              $AccessRule = New-Object System.Security.Principal.FileSystemAccessRule($User, "FullControl", "Allow")
              $Acl.AddAccessRule($AccessRule)
              Set-Acl -Path $TempSshKey -AclObject $Acl

              # 4. Set GIT_SSH_COMMAND using forward slashes for cross-platform OpenSSH compatibility
              $KeyPathFormatted = $TempSshKey -replace '\\', '/'
              $env:GIT_SSH_COMMAND = "ssh -i `"$KeyPathFormatted`" -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL"

              # 5. Create directory if missing
              if (-not (Test-Path $DeployDir)) {
                  New-Item -ItemType Directory -Path $DeployDir -Force
              }

              # 6. Clone or Update
              if (-not (Test-Path "$DeployDir\.git")) {
                  git clone -b $Branch $RepoUrl $DeployDir
              } else {
                  Set-Location $DeployDir
                  git fetch origin $Branch
                  git reset --hard "origin/$Branch"
              }
          }
          finally {
              # 7. Cleanup key
              if (Test-Path $TempSshKey) {
                  Remove-Item -Path $TempSshKey -Force
              }
          }
