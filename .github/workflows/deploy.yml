name: Sync branch to development server

on:
  push:

# Only allow the workflow to read the repository.
permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GIT_TERMINAL_PROMPT: "0"

# Never run two sync operations for the same branch at the same time.
# Different branches can still synchronize in parallel.
concurrency:
  group: branch-sync-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


jobs:
  sync:
    name: Sync ${{ github.ref_name }}
    runs-on: self-hosted

    steps:

      # ------------------------------------------------------------
      # 1. Calculate the directory for this branch
      # ------------------------------------------------------------
      - name: Calculate branch directory
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="/home/fedora/sambashare/FleetManager"

          BRANCH="$GITHUB_REF_NAME"

          # Make the branch name filesystem-friendly.
          #
          # Examples:
          #   main              -> main
          #   develop           -> develop
          #   feature/login     -> feature-login
          #   bugfix/foo/bar    -> bugfix-foo-bar
          #
          SAFE_BRANCH="$(printf '%s' "$BRANCH" | \
            sed 's#[^A-Za-z0-9._-]#-#g')"

          # Add a short hash of the original branch name.
          #
          # This prevents collisions such as:
          #
          #   feature/foo-bar
          #   feature-foo/bar
          #
          # both becoming the same directory.
          BRANCH_HASH="$(printf '%s' "$BRANCH" | sha256sum | cut -c1-8)"

          DIRECTORY_NAME="${SAFE_BRANCH}-${BRANCH_HASH}"

          DEPLOY_DIR="${BASE_DIR}/${DIRECTORY_NAME}"

          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $BRANCH"
          echo "Directory  : $DEPLOY_DIR"

          echo "base_dir=$BASE_DIR" >> "$GITHUB_OUTPUT"
          echo "deploy_dir=$DEPLOY_DIR" >> "$GITHUB_OUTPUT"
          echo "directory_name=$DIRECTORY_NAME" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 2. Create the directory if necessary
      # ------------------------------------------------------------
      - name: Create branch directory
        shell: bash
        env:
          DEPLOY_DIR: ${{ steps.paths.outputs.deploy_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$DEPLOY_DIR"

      # ------------------------------------------------------------
      # 3. Clone the repository for the first time
      # ------------------------------------------------------------
      - name: Clone repository if needed
        shell: bash
        env:
          DEPLOY_DIR: ${{ steps.paths.outputs.deploy_dir }}
        run: |
          set -euo pipefail

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "No Git repository found."
            echo "Creating new repository..."

            cd "$DEPLOY_DIR"

            git init --initial-branch="$GITHUB_REF_NAME"
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

            test -n "$GITHUB_TOKEN" || {
              echo "GITHUB_TOKEN is empty"
              exit 1
            }

            git \
              -c "http.extraheader=Authorization: Bearer ${GITHUB_TOKEN}" \
              -c credential.helper= \
              fetch --prune origin "$GITHUB_SHA"

            git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
            git config core.sharedRepository group

            echo "Initial clone completed."
          else
            echo "Git repository already exists."
          fi
      # ------------------------------------------------------------
      # 4. Make sure the existing directory is clean
      # ------------------------------------------------------------
      - name: Check for local changes
        shell: bash
        env:
          DEPLOY_DIR: ${{ steps.paths.outputs.deploy_dir }}
        run: |
          set -euo pipefail

          cd "$DEPLOY_DIR"

          echo "Checking for local developer changes..."

          if [ -n "$(git status --porcelain)" ]; then
            echo ""
            echo "ERROR: The branch directory contains local changes."
            echo ""
            echo "Directory:"
            echo "  $DEPLOY_DIR"
            echo ""
            echo "Git status:"
            git status --short
            echo ""
            echo "The GitHub Action will NOT overwrite developer changes."
            echo ""
            exit 1
          fi

          echo "Working tree is clean."

      # ------------------------------------------------------------
      # 5. Fetch the pushed commit
      # ------------------------------------------------------------
      - name: Fetch branch
        shell: bash
        env:
          DEPLOY_DIR: ${{ steps.paths.outputs.deploy_dir }}
        run: |
          set -euo pipefail

          cd "$DEPLOY_DIR"

          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          git \
            -c "http.extraheader=Authorization: Bearer ${GITHUB_TOKEN}" \
            -c credential.helper= \
            fetch --prune origin "$GITHUB_SHA"

      # ------------------------------------------------------------
      # 6. Checkout the exact commit that triggered this workflow
      # ------------------------------------------------------------
      - name: Checkout pushed commit
        shell: bash
        env:
          DEPLOY_DIR: ${{ steps.paths.outputs.deploy_dir }}
        run: |
          set -euo pipefail

          cd "$DEPLOY_DIR"

          # Make sure the local branch exists and points to the
          # exact commit that triggered this workflow.
          git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"

          # Make the working tree group writable for Samba users.
          git config core.sharedRepository group

          echo ""
          echo "======================================"
          echo "Branch:  $GITHUB_REF_NAME"
          echo "Commit:  $GITHUB_SHA"
          echo "Path:    $DEPLOY_DIR"
          echo "======================================"
          echo ""

          git status --short
          git log -1 --oneline

      # ------------------------------------------------------------
      # 7. Verify that we ended up at the expected commit
      # ------------------------------------------------------------
      - name: Verify checkout
        shell: bash
        env:
          DEPLOY_DIR: ${{ steps.paths.outputs.deploy_dir }}
        run: |
          set -euo pipefail

          cd "$DEPLOY_DIR"

          ACTUAL_SHA="$(git rev-parse HEAD)"

          if [ "$ACTUAL_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: Checkout verification failed."
            echo "Expected: $GITHUB_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "Checkout verified successfully."
